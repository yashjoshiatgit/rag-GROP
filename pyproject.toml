[project]
name = "rag-rl"
version = "0.1.0"
description = "RAGForge: Training Compact High-Reasoning RAG Models via Reinforcement Learning"
readme = "README.md"
requires-python = ">=3.11, <3.13"
license = { text = "Apache-2.0" }
authors = [
    { name = "RAGForge Team" }
]
dependencies = [
    "torch>=2.4.0",
    "transformers>=4.45.0",
    "datasets>=3.0.0",
    "trl>=0.12.0",
    "peft>=0.13.0",
    "huggingface-hub>=0.25.0",
    "polars>=1.8.0",
    "pyarrow>=17.0.0",
    "pydantic>=2.9.0",
    "pyyaml>=6.0.2",
    "rich>=13.8.0",
    "tqdm>=4.66.0",
    "laya>=0.3.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.6.0",
    "ipykernel>=6.29.0",
]
tracking = [
    "wandb>=0.18.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
